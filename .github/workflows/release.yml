name: Release plugin
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate release tag and assets
        run: npm run check:release -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(dist/main.js dist/manifest.json dist/LICENSE dist/THIRD_PARTY_NOTICES.txt)
          if [[ -f dist/styles.css ]]; then assets+=(dist/styles.css); fi
          plugin_name=$(node -p 'require("./manifest.json").name')
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$plugin_name $RELEASE_TAG" --generate-notes
